<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="icon_2.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <style>
      /* latin-ext */
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Outfit-Variable-Ext.woff2") format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/Outfit-Variable.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #08080c;
        font-family:
          "Outfit",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      #nsv-launch-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #08080c;
        transition:
          transform 0.72s cubic-bezier(0.25, 1, 0.5, 1),
          border-top-left-radius 0.72s cubic-bezier(0.25, 1, 0.5, 1),
          border-top-right-radius 0.72s cubic-bezier(0.25, 1, 0.5, 1),
          opacity 0.72s ease;
        overflow: hidden;
      }

      /* Ambient glowing background decoration */
      #nsv-launch-loader::before {
        content: "";
        position: absolute;
        width: 150vw;
        height: 150vh;
        background: radial-gradient(
          circle at center,
          rgba(145, 70, 255, 0.08) 0%,
          rgba(236, 72, 153, 0.03) 35%,
          rgba(8, 8, 12, 0) 70%
        );
        animation: loader-bg-pulse 8s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes loader-bg-pulse {
        0% {
          transform: translate(-10%, -10%) scale(0.9);
        }
        100% {
          transform: translate(10%, 10%) scale(1.1);
        }
      }

      .loader-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: 24px;
      }

      .logo-img {
        width: min(28vw, 110px);
        height: auto;
        display: block;
        position: relative;
        z-index: 2;
        animation: nsv-logo-float 3s ease-in-out infinite;
        filter: drop-shadow(0 8px 24px rgba(145, 70, 255, 0.3));
      }

      .logo-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 120%;
        height: 120%;
        background: radial-gradient(
          circle,
          rgba(145, 70, 255, 0.25) 0%,
          rgba(145, 70, 255, 0) 70%
        );
        z-index: 1;
        filter: blur(10px);
        animation: nsv-glow-pulse 3s ease-in-out infinite;
      }

      @keyframes nsv-logo-float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-8px) scale(1.02);
        }
      }

      @keyframes nsv-glow-pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: translate(-50%, -50%) scale(0.95);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.15);
        }
      }

      .brand-title {
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 4px 0;
        background: linear-gradient(
          135deg,
          #a855f7 0%,
          #ec4899 50%,
          #f43f5e 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 10px rgba(168, 85, 247, 0.15));
      }

      .brand-subtitle {
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        margin-bottom: 28px;
        margin-top: 0;
      }

      .spinner-container {
        position: relative;
        width: 36px;
        height: 36px;
        margin-bottom: 20px;
      }

      .spinner-ring {
        box-sizing: border-box;
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2.5px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
      }

      .spinner-arc {
        box-sizing: border-box;
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2.5px solid transparent;
        border-top-color: #a855f7;
        border-right-color: #ec4899;
        border-radius: 50%;
        animation: spinner-spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.4));
      }

      @keyframes spinner-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loader-status {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.45);
        font-weight: 500;
        letter-spacing: 0.02em;
        height: 1.2rem;
        transition: opacity 0.2s ease;
      }

      #nsv-launch-loader.is-hiding {
        transform: translateY(108%);
        border-top-left-radius: 48px;
        border-top-right-radius: 48px;
        opacity: 0.95;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #nsv-launch-loader,
        .logo-img,
        .logo-glow,
        .spinner-arc {
          animation: none;
          transition: none;
        }

        #nsv-launch-loader.is-hiding {
          opacity: 0;
          transform: none;
        }
      }
    </style>
    <title>NoSubVod</title>
  </head>
  <body>
    <div id="nsv-launch-loader" aria-hidden="true">
      <div class="loader-content">
        <div class="logo-wrapper">
          <img src="/icon_2.png" alt="NoSubVod" class="logo-img" />
          <div class="logo-glow"></div>
        </div>
        <h1 class="brand-title">NoSubVOD</h1>
        <h2 class="brand-subtitle">iOS Client</h2>
        <div class="spinner-container">
          <div class="spinner-ring"></div>
          <div class="spinner-arc"></div>
        </div>
        <div id="loader-status" class="loader-status">
          Initialisation du système...
        </div>
      </div>
    </div>
    <script>
      (function () {
        const statuses = [
          "Chargement de la base...",
          "Initialisation du serveur local...",
          "Vérification de la session...",
          "Connexion au bridge Tauri...",
          "Préparation du portail...",
        ];
        let index = 0;
        const statusEl = document.getElementById("loader-status");

        function updateStatus() {
          if (!statusEl) return;
          statusEl.style.opacity = "0";
          setTimeout(() => {
            if (index < statuses.length) {
              statusEl.textContent = statuses[index++];
              statusEl.style.opacity = "1";
            }
          }, 200);
        }

        setTimeout(updateStatus, 350);

        const interval = setInterval(() => {
          if (index >= statuses.length) {
            clearInterval(interval);
          } else {
            updateStatus();
          }
        }, 1100);

        window.__nsvLoaderInterval = interval;
      })();
    </script>
    <div id="root"></div>
    <script type="module">
      import { initDebugTools, initNSVLogger } from "./src/utils/debug.ts";
      initNSVLogger(true);
      initDebugTools(false);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
