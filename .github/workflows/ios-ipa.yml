name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "mig/*"]

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || echo "Using default Xcode"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild clean build \
            -project NoSubVod.xcodeproj \
            -scheme NoSubVod \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build_output

          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/NoSubVod.app Payload/
          zip -r NoSubVod-iOS.ipa Payload
          rm -rf Payload build_output

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nosubvod-ios-${{ github.run_number }}-${{ github.sha }}
          path: NoSubVod-iOS.ipa
          retention-days: 14
          if-no-files-found: error
