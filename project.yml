name: NoSubVod
options:
  bundleIdPrefix: com.theorhd
  deploymentTarget:
    iOS: 17.0

packages:
  TSPlayerKit:
    url: https://github.com/Theorhd/TSPlayerKit
    from: 1.2.0

targets:
  NoSubVod:
    type: application
    platform: iOS
    sources: Sources
    dependencies:
      - package: TSPlayerKit
    settings:
      SWIFT_STRICT_CONCURRENCY: targeted
    preBuildScripts:
      # Injecte Sources/Secrets/AppSecrets.swift depuis .env à CHAQUE build
      # (Xcode inclus — sans ça, un .env édité n'est pas pris en compte au Run).
      - name: Inject AppSecrets
        script: |
          cd "$SRCROOT"
          scripts/generate_secrets.sh --allow-placeholders
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIBackgroundModes:
          - audio
          - fetch
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  NoSubVodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NoSubVodTests
      - path: Tests/Fixtures
        type: folder
    dependencies:
      - target: NoSubVod
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.theorhd.NoSubVodTests
      INFOPLIST_FILE: Tests/NoSubVodTests/Info.plist
